<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울시 보도자료 — 놓치지 않기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2efe6;
    --ink:#1f2a24;
    --line:#c9c2ab;
    --navy:#26344a;
    --stamp:#a4342a;
    --stamp-mid:#9c7a2c;
    --stamp-low:#7c8577;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:36px 20px 20px;
    border-bottom:2px solid var(--ink);
    max-width:860px;
    margin:0 auto;
  }
  header h1{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:clamp(28px,5vw,40px);
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:14px;
    color:#565f56;
  }
  .filters{
    max-width:860px;
    margin:16px auto 0;
    padding:0 20px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filters button{
    font-family:'Space Mono',monospace;
    font-size:12px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    padding:6px 12px;
    cursor:pointer;
    border-radius:999px;
  }
  .filters button.active{
    background:var(--ink);
    color:var(--paper);
  }
  main{
    max-width:860px;
    margin:24px auto 80px;
    padding:0 20px;
  }
  .day-group{margin-bottom:8px;}
  .day-label{
    font-family:'Space Mono',monospace;
    font-size:13px;
    color:#6b7466;
    border-bottom:1px solid var(--line);
    padding:14px 0 6px;
    position:sticky;
    top:0;
    background:var(--paper);
  }
  .item{
    border-bottom:1px solid var(--line);
    padding:14px 0;
    cursor:pointer;
  }
  .item-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .stamp{
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:50%;
    border:2.5px solid var(--stamp-low);
    color:var(--stamp-low);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:13px;
    transform:rotate(-8deg);
    opacity:0.85;
  }
  .stamp.high{border-color:var(--stamp);color:var(--stamp);opacity:1;}
  .stamp.mid{border-color:var(--stamp-mid);color:var(--stamp-mid);opacity:1;}
  .item-body{flex:1 1 auto;min-width:0;}
  .item-title{
    font-family:'Noto Serif KR',serif;
    font-weight:500;
    font-size:17px;
    line-height:1.4;
    margin:0 0 4px;
  }
  .item-meta{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:#6b7466;
  }
  .item-meta .cat{
    border:1px solid #6b7466;
    padding:1px 6px;
    border-radius:3px;
    margin-right:6px;
  }
  .summary{
    display:none;
    margin:12px 0 0 56px;
    padding:12px 14px;
    background:#e8e3d3;
    border-left:3px solid var(--navy);
    font-size:14px;
    line-height:1.7;
  }
  .summary.open{display:block;}
  .summary ul{margin:0;padding-left:18px;}
  .summary a{
    display:inline-block;
    margin-top:8px;
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--navy);
  }
  .empty{
    font-family:'Space Mono',monospace;
    font-size:13px;
    color:#6b7466;
    padding:40px 0;
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>서울시 보도자료</h1>
  <p>주택·교통은 전부, 그 외 분야는 겹치는 사안만 — 도장 색이 진할수록 중요도가 높습니다.</p>
</header>

<div class="filters" id="filters"></div>

<main id="main">
  <div class="empty">불러오는 중…</div>
</main>

<script>
const CATEGORIES = ["전체", "주택", "교통", "경제", "문화", "안전", "환경", "행정", "복지"];
let currentFilter = "전체";
let allItems = [];

function stampLabel(importance){
  if(importance === "높음") return "重要";
  if(importance === "중간") return "参考";
  return "確認";
}
function stampClass(importance){
  if(importance === "높음") return "high";
  if(importance === "중간") return "mid";
  return "";
}

function render(){
  const main = document.getElementById("main");
  const filtered = currentFilter === "전체"
    ? allItems
    : allItems.filter(i => i.category === currentFilter);

  if(filtered.length === 0){
    main.innerHTML = '<div class="empty">해당 분야의 보도자료가 아직 없습니다.</div>';
    return;
  }

  const byDate = {};
  filtered.forEach(item => {
    (byDate[item.date] = byDate[item.date] || []).push(item);
  });

  main.innerHTML = Object.keys(byDate).sort().reverse().map(date => `
    <div class="day-group">
      <div class="day-label">${date}</div>
      ${byDate[date].map(renderItem).join("")}
    </div>
  `).join("");

  document.querySelectorAll(".item").forEach(el => {
    el.addEventListener("click", () => {
      const summary = el.querySelector(".summary");
      if(summary) summary.classList.toggle("open");
    });
  });
}

function renderItem(item){
  const hasSummary = item.summary && item.summary.length > 0;
  return `
    <div class="item">
      <div class="item-row">
        <div class="stamp ${stampClass(item.importance)}">${stampLabel(item.importance)}</div>
        <div class="item-body">
          <p class="item-title">${item.title}</p>
          <div class="item-meta">
            <span class="cat">${item.category || "미분류"}</span>${item.dept} · ${item.date}
          </div>
        </div>
      </div>
      ${hasSummary ? `
        <div class="summary">
          <ul>${item.summary.map(s => `<li>${s.replace(/^[□○]\s*/, "")}</li>`).join("")}</ul>
          <a href="${item.url}" target="_blank" rel="noopener">서울시 원문 보기 →</a>
        </div>
      ` : `
        <div class="summary"><a href="${item.url}" target="_blank" rel="noopener">서울시 원문 보기 →</a></div>
      `}
    </div>
  `;
}

function buildFilters(){
  const el = document.getElementById("filters");
  el.innerHTML = CATEGORIES.map(c =>
    `<button data-cat="${c}" class="${c===currentFilter?'active':''}">${c}</button>`
  ).join("");
  el.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.cat;
      el.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
  });
}

fetch("data/news.json?_=" + Date.now())
  .then(res => res.json())
  .then(data => {
    allItems = data;
    buildFilters();
    render();
  })
  .catch(() => {
    document.getElementById("main").innerHTML =
      '<div class="empty">데이터를 아직 불러올 수 없습니다. Actions가 한 번 실행된 후 다시 열어보세요.</div>';
  });
</script>

</body>
</html>
