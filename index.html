<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보도자료 — 놓치지 않기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2efe6;
    --panel:#ece7d8;
    --ink:#1f2a24;
    --sub:#6b7466;
    --line:#c9c2ab;
    --navy:#26344a;
    --stamp:#a4342a;
    --stamp-mid:#9c7a2c;
    --stamp-low:#7c8577;
    --star:#c9962c;
    --badge-bg:#26344a;
    --badge-text:#f2efe6;
    --core-bg:#a4342a;
    --core-text:#f7ede9;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#1c1d19;
      --panel:#25261f;
      --ink:#d8d4c6;
      --sub:#918d7c;
      --line:#38392f;
      --navy:#9db3d9;
      --stamp:#d99287;
      --stamp-mid:#cdac6c;
      --stamp-low:#84826f;
      --star:#d4ad55;
      --badge-bg:#3a4a63;
      --badge-text:#dbe4f2;
      --core-bg:#7c342c;
      --core-text:#f1ddd8;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }
  .layout{
    display:flex;
    max-width:1180px;
    margin:0 auto;
    min-height:100vh;
  }

  /* ---------- 사이드바 ---------- */
  .sidebar{
    width:220px;
    flex:0 0 220px;
    padding:28px 16px;
    border-right:1px solid var(--line);
  }
  .sidebar h2{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--sub);
    letter-spacing:0.08em;
    margin:0 0 10px;
    text-transform:uppercase;
  }
  .region-list{list-style:none;margin:0 0 28px;padding:0;}
  .region-list li{margin-bottom:2px;}
  .region-btn{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    text-align:left;
    padding:9px 10px;
    border-radius:6px;
    font-size:14px;
    font-family:'Noto Sans KR',sans-serif;
    color:var(--ink);
    cursor:pointer;
  }
  .region-btn:hover{background:var(--panel);}
  .region-btn.active{background:var(--navy);color:var(--paper);}
  .region-btn.disabled{color:var(--sub);cursor:default;}
  .region-btn.disabled:hover{background:none;}
  .region-count{
    font-family:'Space Mono',monospace;
    font-size:11px;
    opacity:0.8;
  }
  .region-badge-coming{
    font-family:'Space Mono',monospace;
    font-size:10px;
    color:var(--sub);
  }
  .fav-shortcut{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 10px;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
  }
  .fav-shortcut.active{background:var(--panel);border-color:var(--ink);}

  /* ---------- 메인 ---------- */
  .main{flex:1 1 auto;padding:28px 24px 80px;min-width:0;}
  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:8px;
  }
  .top-bar h1{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:26px;
    margin:0;
  }
  .top-bar .count{
    font-family:'Space Mono',monospace;
    font-size:13px;
    color:var(--sub);
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--ink);
    border-radius:8px;
    padding:10px 14px;
    margin-bottom:14px;
    background:var(--panel);
  }
  .search-box input{
    border:none;
    background:none;
    outline:none;
    flex:1;
    font-size:14px;
    font-family:'Noto Sans KR',sans-serif;
    color:var(--ink);
  }
  .search-box svg{flex:0 0 auto;color:var(--sub);}

  .cat-filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .cat-filters button{
    font-family:'Space Mono',monospace;
    font-size:12px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    padding:7px 14px;
    cursor:pointer;
    border-radius:999px;
  }
  .cat-filters button.active{background:var(--ink);color:var(--paper);}

  .item{
    border-bottom:1px solid var(--line);
    padding:14px 0;
    cursor:pointer;
  }
  .item-row{display:flex;align-items:flex-start;gap:10px;}
  .badge{
    flex:0 0 auto;
    font-family:'Space Mono',monospace;
    font-size:11px;
    padding:3px 8px;
    border-radius:4px;
    white-space:nowrap;
    margin-top:2px;
  }
  .badge.region{background:var(--badge-bg);color:var(--badge-text);}
  .badge.cat{border:1px solid var(--sub);color:var(--sub);}
  .badge.cat.core{background:var(--core-bg);color:var(--core-text);border:none;}
  .item-body{flex:1 1 auto;min-width:0;}
  .item-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .item-title{
    font-family:'Noto Serif KR',serif;
    font-weight:500;
    font-size:16px;
    line-height:1.5;
    margin:0;
  }
  .item-meta{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--sub);
    margin-top:4px;
  }
  .star-btn{
    flex:0 0 auto;
    background:none;
    border:none;
    cursor:pointer;
    padding:2px;
    font-size:18px;
    color:var(--line);
    line-height:1;
  }
  .star-btn.on{color:var(--star);}

  .imp-mark{
    flex:0 0 auto;
    width:8px;height:8px;border-radius:50%;
    margin-top:8px;
    background:var(--stamp-low);
  }
  .imp-mark.높음{background:var(--stamp);}
  .imp-mark.중간{background:var(--stamp-mid);}

  .summary{
    display:none;
    margin:12px 0 0 34px;
    padding:12px 14px;
    background:var(--panel);
    border-left:3px solid var(--navy);
    font-size:14px;
    line-height:1.7;
  }
  .summary.open{display:block;}
  .summary ul{margin:0;padding-left:18px;}
  .summary a{
    display:inline-block;
    margin-top:8px;
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--navy);
  }

  .empty{
    font-family:'Space Mono',monospace;
    font-size:13px;
    color:var(--sub);
    padding:40px 0;
    text-align:center;
  }

  /* ---------- 위원회 안건 ---------- */
  .sheet-link-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
    padding:10px 14px;
    background:var(--panel);
    border-radius:8px;
    font-size:13px;
    color:var(--sub);
  }
  .sheet-link-bar a{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--navy);
    white-space:nowrap;
  }
  .committee-card{
    border-bottom:1px solid var(--line);
    padding:14px 0;
    cursor:pointer;
  }
  .committee-card:hover{background:var(--panel);}
  .committee-top{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:6px;
  }
  .committee-date{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--sub);
  }
  .committee-title{
    font-family:'Noto Serif KR',serif;
    font-weight:500;
    font-size:16px;
    margin:0;
    line-height:1.5;
  }
  .committee-actions{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:8px;
  }
  .committee-toggle-btn{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--navy);
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    padding:4px 10px;
    cursor:pointer;
  }
  .committee-actions a{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--navy);
  }
  .committee-detail{
    display:none;
    margin-top:10px;
    padding-top:6px;
    border-top:1px dashed var(--line);
  }
  .committee-detail.open{display:block;}
  .committee-fields{
    font-size:14px;
    line-height:1.6;
    margin:0;
  }
  .committee-fields dt{
    font-weight:500;
    font-size:14px;
    margin-top:12px;
  }
  .committee-fields dt:first-child{margin-top:0;}
  .committee-fields dd{margin:4px 0 0;color:var(--sub);}
  .committee-fields dd .committee-result,
  .committee-fields dd .committee-note{
    font-family:'Space Mono',monospace;
    font-size:12px;
    margin-top:2px;
  }
  .committee-meta{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--sub);
    margin-top:8px;
  }
  .committee-meta a{color:var(--navy);margin-left:8px;}

  @media (max-width: 720px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;flex:none;border-right:none;border-bottom:1px solid var(--line);}
    .region-list{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;}
    .region-list li{margin:0;}
  }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <h2>지역</h2>
    <ul class="region-list" id="regionList"></ul>
    <button class="fav-shortcut" id="favShortcut">★ 즐겨찾기만 보기</button>

    <h2 style="margin-top:20px;">안건</h2>
    <ul class="region-list" id="committeeNav">
      <li><button class="region-btn" id="committeeBtn" data-view="committee">
        <span>🏛 위원회</span><span class="region-count" id="committeeCount"></span>
      </button></li>
    </ul>
  </aside>

  <main class="main">
    <div class="top-bar">
      <h1 id="top-bar-title">보도자료</h1>
      <span class="count" id="totalCount"></span>
    </div>

    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="제목, 부서, 키워드로 검색...">
    </div>

    <div class="cat-filters" id="catFilters"></div>

    <div id="main-list">
      <div class="empty">불러오는 중…</div>
    </div>
  </main>
</div>

<script>
const FAVORITES_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwtoiQ12i61rndH4xhX-b8qGAxM0aJi4agYvBUoOv6CKHRj-GRNRQ5MDDFSYFXkTI-I6g/exec"; // google-apps-script/Code.gs 배포 후 여기에 웹 앱 URL 붙여넣기
const COMMITTEE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1rwW4vfoeqlC89j8F8A1iz5Ol71yxIy07s5YLPjYYGoY/edit"; // news tracker DB 구글시트

let regions = [];
let allItems = [];
let committeeItems = [];
let currentRegion = "all";
let currentCat = "전체";
let currentQuery = "";
let showFavOnly = false;
let viewMode = "news"; // "news" | "committee"

function favKey(){ return "favorites_v1"; }
function loadFavorites(){
  try{ return JSON.parse(localStorage.getItem(favKey()) || "{}"); }catch(e){ return {}; }
}
function saveFavorites(favs){
  localStorage.setItem(favKey(), JSON.stringify(favs));
}
function sendToSheet(item, action){
  if(!FAVORITES_WEBAPP_URL) return;
  fetch(FAVORITES_WEBAPP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({
      action: action, // "즐겨찾기" 또는 "해제"
      region_name: item.region_name,
      category: item.category,
      title: item.title,
      dept: item.dept,
      date: item.date,
      url: item.url,
    }),
  }).catch(() => {});
}

function toggleFavorite(item, btnEl){
  const favs = loadFavorites();
  const isOn = !!favs[item.id];
  if(isOn){
    delete favs[item.id];
    sendToSheet(item, "해제");
  }else{
    favs[item.id] = true;
    sendToSheet(item, "즐겨찾기");
  }
  saveFavorites(favs);
  btnEl.classList.toggle("on", !isOn);
  if(showFavOnly) render();
}

function normalize(item, idx){
  return Object.assign({
    id: item.region ? item.id : ("seoul-" + (item.nttNo || idx)),
    region: item.region || "seoul",
    region_name: item.region_name || "서울특별시",
  }, item);
}

function buildRegionList(){
  const el = document.getElementById("regionList");
  const countAll = allItems.length;
  const rows = [{ id: "all", name: "전체", status: "active", count: countAll }]
    .concat(regions.map(r => ({
      ...r,
      count: allItems.filter(i => i.region === r.id).length,
    })));

  el.innerHTML = rows.map(r => {
    if(r.status !== "active"){
      return `<li><button class="region-btn disabled" disabled>
        <span>${r.name}</span><span class="region-badge-coming">준비중</span>
      </button></li>`;
    }
    return `<li><button class="region-btn ${r.id===currentRegion?'active':''}" data-region="${r.id}">
      <span>${r.name}</span><span class="region-count">${r.count}</span>
    </button></li>`;
  }).join("");

  el.querySelectorAll("button[data-region]").forEach(btn => {
    btn.addEventListener("click", () => {
      currentRegion = btn.dataset.region;
      showFavOnly = false;
      viewMode = "news";
      document.getElementById("favShortcut").classList.remove("active");
      document.getElementById("committeeBtn").classList.remove("active");
      document.getElementById("catFilters").style.display = "";
      buildRegionList();
      render();
    });
  });
}

function buildCatFilters(){
  const cats = ["전체", ...new Set(allItems.map(i => i.category).filter(Boolean))];
  const el = document.getElementById("catFilters");
  el.innerHTML = cats.map(c =>
    `<button data-cat="${c}" class="${c===currentCat?'active':''}">${c}</button>`
  ).join("");
  el.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      currentCat = btn.dataset.cat;
      el.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
  });
}

function matchesQuery(item, q){
  if(!q) return true;
  const hay = (item.title + " " + (item.dept||"") + " " + (item.category||"")).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function matchesCommitteeQuery(item, q){
  if(!q) return true;
  const hay = [item.committee_type, item.session, item.agenda_name, item.agenda_summary, item.result, item.note]
    .filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}

let committeeExpanded = new Set();

function escapeAttr(str){
  return String(str || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
}

function groupCommitteeItems(items){
  const map = new Map();
  items.forEach(item => {
    const key = item.url || `${item.committee_type || ""}|${item.session || ""}|${item.date || ""}`;
    if(!map.has(key)){
      map.set(key, {
        key,
        committee_type: item.committee_type,
        session: item.session,
        date: item.date,
        url: item.url,
        detected_at: item.detected_at,
        items: [],
      });
    }
    map.get(key).items.push(item);
  });
  return Array.from(map.values()).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}

function committeeSummaryLine(group){
  const first = group.items[0] || {};
  if(group.items.length === 1){
    return first.agenda_summary || first.agenda_name || "안건 개요가 없습니다.";
  }
  const names = group.items.map(i => i.agenda_name).filter(Boolean).slice(0, 3).join(", ");
  return `안건 ${group.items.length}건 처리 · ${names}${group.items.length > 3 ? " 외" : ""}`;
}

function renderCommittee(){
  document.getElementById("top-bar-title").textContent = "위원회 안건";

  let filteredItems = committeeItems;
  if(currentQuery) filteredItems = filteredItems.filter(i => matchesCommitteeQuery(i, currentQuery));

  const groups = groupCommitteeItems(filteredItems);

  document.getElementById("totalCount").textContent = `총 ${groups.length}건 (안건 ${filteredItems.length}건)`;

  const listEl = document.getElementById("main-list");

  const sheetBar = COMMITTEE_SHEET_URL
    ? `<div class="sheet-link-bar"><span>안건표는 첨부 한글파일에서 자동 추출됩니다. 표가 이상하면 구글시트 원본을 확인하세요.</span><a href="${COMMITTEE_SHEET_URL}" target="_blank" rel="noopener">구글시트에서 전체 보기 →</a></div>`
    : "";

  if(groups.length === 0){
    listEl.innerHTML = sheetBar + '<div class="empty">아직 수집된 위원회 안건이 없습니다.</div>';
    return;
  }

  listEl.innerHTML = sheetBar + groups.map(renderCommitteeGroup).join("");

  listEl.querySelectorAll(".committee-card").forEach(el => {
    el.addEventListener("click", (e) => {
      if(e.target.closest("a")) return;
      const key = el.dataset.key;
      const detail = el.querySelector(".committee-detail");
      const btn = el.querySelector(".committee-toggle-btn");
      const isOpen = detail.classList.toggle("open");
      if(isOpen) committeeExpanded.add(key); else committeeExpanded.delete(key);
      if(btn) btn.textContent = isOpen ? "안건 접기 ▴" : `안건 ${el.dataset.count}건 펼쳐보기 ▾`;
    });
  });
}

function renderCommitteeGroup(group){
  const isOpen = committeeExpanded.has(group.key);
  return `
    <div class="committee-card" data-key="${escapeAttr(group.key)}" data-count="${group.items.length}">
      <div class="committee-top">
        <span class="badge region">${group.committee_type || "위원회"}</span>
        ${group.session ? `<span class="badge cat">${group.session}</span>` : ""}
        <span class="committee-date">${group.date || ""}</span>
      </div>
      <p class="committee-title">${committeeSummaryLine(group)}</p>
      <div class="committee-actions">
        <button class="committee-toggle-btn">${isOpen ? "안건 접기 ▴" : `안건 ${group.items.length}건 펼쳐보기 ▾`}</button>
        ${group.url ? `<a href="${group.url}" target="_blank" rel="noopener">원문 보기 →</a>` : ""}
      </div>
      <div class="committee-detail ${isOpen ? "open" : ""}">
        <dl class="committee-fields">
          ${group.items.map(renderCommitteeAgendaRow).join("")}
        </dl>
      </div>
      <div class="committee-meta">수집 ${group.detected_at || ""}</div>
    </div>
  `;
}

function renderCommitteeAgendaRow(item){
  return `
    <dt>${item.agenda_name || "(안건명 미확인)"}</dt>
    <dd>
      ${item.agenda_summary ? `<div>${item.agenda_summary}</div>` : ""}
      ${item.result ? `<div class="committee-result">심의결과: ${item.result}</div>` : ""}
      ${item.note ? `<div class="committee-note">비고: ${item.note}</div>` : ""}
    </dd>
  `;
}

function render(){
  if(viewMode === "committee"){ renderCommittee(); return; }
  document.getElementById("top-bar-title").textContent = "보도자료";
  const favs = loadFavorites();
  let filtered = allItems;
  if(currentRegion !== "all") filtered = filtered.filter(i => i.region === currentRegion);
  if(currentCat !== "전체") filtered = filtered.filter(i => i.category === currentCat);
  if(currentQuery) filtered = filtered.filter(i => matchesQuery(i, currentQuery));
  if(showFavOnly) filtered = filtered.filter(i => favs[i.id]);

  document.getElementById("totalCount").textContent = `총 ${filtered.length}건`;

  const listEl = document.getElementById("main-list");
  if(filtered.length === 0){
    listEl.innerHTML = '<div class="empty">해당하는 보도자료가 없습니다.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(item => renderItem(item, favs)).join("");

  listEl.querySelectorAll(".item").forEach(el => {
    el.addEventListener("click", (e) => {
      if(e.target.closest(".star-btn")) return;
      const summary = el.querySelector(".summary");
      if(summary) summary.classList.toggle("open");
    });
  });
  listEl.querySelectorAll(".star-btn").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = el.dataset.id;
      const item = allItems.find(i => i.id === id);
      if(item) toggleFavorite(item, el);
    });
  });
}

function renderItem(item, favs){
  const hasSummary = item.summary && item.summary.length > 0;
  const isFav = !!favs[item.id];
  return `
    <div class="item">
      <div class="item-row">
        <span class="imp-mark ${item.importance||''}" title="중요도: ${item.importance||'낮음'}"></span>
        <span class="badge region">${item.region_name}</span>
        <span class="badge cat${(item.category === '주택' || item.category === '교통') ? ' core' : ''}">${item.category || "미분류"}</span>
        <div class="item-body">
          <div class="item-title-row">
            <p class="item-title">${item.title}</p>
            <button class="star-btn ${isFav?'on':''}" data-id="${item.id}">★</button>
          </div>
          <div class="item-meta">${item.dept} · ${item.date}</div>
        </div>
      </div>
      ${hasSummary ? `
        <div class="summary">
          <ul>${item.summary.map(s => `<li>${s.replace(/^[□○]\s*/, "")}</li>`).join("")}</ul>
          <a href="${item.url}" target="_blank" rel="noopener">원문 보기 →</a>
        </div>
      ` : `
        <div class="summary"><a href="${item.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
      `}
    </div>
  `;
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  currentQuery = e.target.value.trim();
  render();
});
document.getElementById("favShortcut").addEventListener("click", (e) => {
  showFavOnly = !showFavOnly;
  viewMode = "news";
  document.getElementById("committeeBtn").classList.remove("active");
  document.getElementById("catFilters").style.display = "";
  e.currentTarget.classList.toggle("active", showFavOnly);
  render();
});
document.getElementById("committeeBtn").addEventListener("click", (e) => {
  viewMode = "committee";
  showFavOnly = false;
  currentQuery = "";
  document.getElementById("searchInput").value = "";
  document.getElementById("favShortcut").classList.remove("active");
  document.getElementById("catFilters").style.display = "none";
  document.querySelectorAll("#regionList button").forEach(b => b.classList.remove("active"));
  e.currentTarget.classList.add("active");
  render();
});

fetch("data/regions.json?_=" + Date.now())
  .then(r => r.json())
  .catch(() => [])
  .then((regionsData) => {
    regions = regionsData || [];
    const activeRegions = regions.filter(r => r.status === "active");
    return Promise.all(activeRegions.map(r =>
      fetch(`data/${r.file}?_=` + Date.now()).then(res => res.json()).catch(() => [])
    ));
  })
  .then(datasets => {
    allItems = datasets.flat().map(normalize);
    buildRegionList();
    buildCatFilters();
    render();
  })
  .catch(() => {
    document.getElementById("main-list").innerHTML =
      '<div class="empty">데이터를 아직 불러올 수 없습니다. Actions가 한 번 실행된 후 다시 열어보세요.</div>';
  });

fetch("data/committee.json?_=" + Date.now())
  .then(r => r.json())
  .catch(() => [])
  .then(data => {
    committeeItems = data || [];
    document.getElementById("committeeCount").textContent = committeeItems.length || "";
    if(viewMode === "committee") render();
  })
  .catch(() => {});
</script>

</body>
</html>
