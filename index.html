<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2A44">
<title>지역 보도자료 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F3;
    --card:#FFFFFF;
    --ink:#1B2A44;
    --ink-soft:#69728A;
    --seal:#A6303C;
    --line:#E7E2D6;
    --active-bg:#1B2A44;
    --mono:'Noto Sans KR', sans-serif;
    --serif:'Noto Serif KR', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--mono);
    line-height:1.4;
  }

  header{
    padding:18px 20px 10px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  header h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:19px;
    margin:0;
    letter-spacing:-0.3px;
  }
  .quote{
    font-family:var(--serif);
    font-style:italic;
    font-size:12px;
    color:var(--ink-soft);
    flex:1;
    min-width:200px;
    text-align:center;
  }
  .meta-line{
    font-size:12px;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  .layout{
    display:flex;
    align-items:flex-start;
    gap:16px;
    max-width:1120px;
    margin:0 auto;
    padding:0 16px 40px;
  }

  /* ---- 사이드바 ---- */
  .sidebar{
    width:200px;
    flex-shrink:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 10px;
    position:sticky;
    top:16px;
  }
  .sidebar-title{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:700;
    padding:2px 10px 8px;
    letter-spacing:.5px;
  }
  .region-btn{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:9px 10px;
    font-family:var(--mono);
    font-size:13.5px;
    color:var(--ink);
    border-radius:10px;
    cursor:pointer;
    margin-bottom:2px;
  }
  .region-btn:hover{ background:var(--paper); }
  .region-btn.active{ background:var(--active-bg); color:#fff; }
  .region-btn .icon{ font-size:14px; flex-shrink:0; }
  .region-btn .name{ flex:1; }
  .region-btn .cnt{
    font-size:10.5px;
    padding:2px 7px;
    border-radius:20px;
    background:var(--paper);
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .region-btn.active .cnt{ background:rgba(255,255,255,.18); color:#fff; }
  .region-btn.empty .cnt{ opacity:.6; }

  .sidebar hr{ border:none; border-top:1px solid var(--line); margin:10px 6px; }
  .star-nav{ color:var(--seal); font-weight:700; }
  .star-nav.active{ background:var(--seal); color:#fff; }

  /* ---- 콘텐츠 ---- */
  .content{ flex:1; min-width:0; }
  .search-box{
    width:100%;
    padding:11px 14px;
    font-size:14px;
    font-family:var(--mono);
    border:1px solid var(--line);
    background:var(--card);
    border-radius:12px;
    outline:none;
  }
  .search-box:focus{ border-color:var(--ink); }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
  .filter-chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:12.5px;
    padding:6px 13px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    border-radius:20px;
    cursor:pointer;
  }
  .filter-chip.active{
    background:var(--active-bg);
    border-color:var(--active-bg);
    color:#fff;
  }

  .count-line{
    margin:14px 0 0;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    padding-bottom:8px;
  }

  main{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }

  .item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 14px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .item:last-child{ border-bottom:none; }
  .item:hover{ background:var(--paper); }

  .star-btn{
    flex-shrink:0;
    border:none;
    background:none;
    cursor:pointer;
    font-size:17px;
    color:var(--line);
    line-height:1;
    padding:2px;
  }
  .star-btn.active{ color:var(--seal); }

  .item .tags{ display:flex; gap:5px; flex-shrink:0; }
  .tag{
    font-size:10.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:6px;
    white-space:nowrap;
  }
  .tag.region{ background:#EEF0F5; color:var(--ink); }
  .tag.category{ background:var(--paper); color:var(--ink-soft); }

  .item a.line{
    flex:1;
    min-width:0;
    text-decoration:none;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item a.line:hover{ text-decoration:underline; }
  .item .dept{ color:var(--ink-soft); font-weight:400; }

  .item .date{
    flex-shrink:0;
    font-size:11.5px;
    color:var(--ink-soft);
    width:78px;
    text-align:right;
  }

  .empty{
    text-align:center;
    padding:70px 20px;
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.8;
  }
  .empty strong{ display:block; font-family:var(--serif); font-size:17px; color:var(--ink); margin-bottom:6px; }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding:16px;
  }

  /* ---- 모바일 ---- */
  @media (max-width:760px){
    header{ padding:14px 14px 4px; }
    .quote{ order:3; width:100%; text-align:left; font-size:11px; }
    .layout{ flex-direction:column; padding:0 10px 30px; }
    .sidebar{
      width:100%;
      position:static;
      display:flex;
      overflow-x:auto;
      padding:10px;
      gap:6px;
      border-radius:12px;
    }
    .sidebar-title{ display:none; }
    .region-btn{
      width:auto;
      white-space:nowrap;
      flex-shrink:0;
      margin-bottom:0;
      padding:8px 12px;
    }
    .sidebar hr{ display:none; }
    .star-nav{ margin-left:4px; }

    .item{ flex-wrap:wrap; padding:12px; }
    .item a.line{
      white-space:normal;
      overflow:visible;
      text-overflow:unset;
      flex-basis:100%;
      order:3;
      font-size:13.5px;
      line-height:1.5;
      margin-top:2px;
    }
    .item .date{ width:auto; order:2; margin-left:auto; }
  }
</style>
</head>
<body>

<header>
  <h1>보도자료</h1>
  <div class="quote">"Never regret yesterday. Life is in me today, and make my own tomorrow." — L. Ron Hubbard</div>
  <div class="meta-line" id="metaLine">불러오는 중...</div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-title">지역</div>
  </nav>

  <div class="content">
    <input type="text" class="search-box" id="searchInput" placeholder="🔍  제목, 부서, 키워드로 검색...">
    <div class="filters" id="categoryFilters"></div>

    <div class="count-line">
      <span id="countText">불러오는 중...</span>
      <span>최신순 정렬</span>
    </div>

    <main id="list"></main>
  </div>
</div>

<footer>
  각 게시물의 원문은 해당 지자체 공식 누리집에서 제공됩니다. ★를 눌러 즐겨찾기에 담아두세요 (이 브라우저에만 저장돼요).
</footer>

<script>
const DATA_SOURCES = [
  { file: 'data/seoul.json', region: '서울특별시' },
  // { file: 'data/gyeonggi.json', region: '경기도' },
  // { file: 'data/daejeon.json', region: '대전광역시' },
  // { file: 'data/daegu.json', region: '대구광역시' },
  // { file: 'data/incheon.json', region: '인천광역시' },
  // { file: 'data/busan.json', region: '부산광역시' },
  // { file: 'data/jeonnam-gwangju.json', region: '전남광주통합특별시' },
  // { file: 'data/ansan.json', region: '안산시' },
  // { file: 'data/suwon.json', region: '수원시' },
  // { file: 'data/hwaseong.json', region: '화성시' },
];

const ALL_REGIONS = [
  '서울특별시', '경기도', '대전광역시', '대구광역시', '인천광역시',
  '부산광역시', '전남광주통합특별시', '안산시', '수원시', '화성시'
];

const CATEGORY_ICONS = {
  '문화': '🎭', '경제': '📈', '주택': '🏠', '교통': '🚌',
  '도시계획': '🏙️', '안전': '🛡️', '환경': '🌳', '행정': '🏛️', '복지': '🤝'
};

const BOOKMARK_KEY = 'news-bookmarks-v1';
let allItems = [];
let activeRegion = '전체';
let activeCategory = '전체';
let showBookmarksOnly = false;

function getBookmarks(){
  try{ return JSON.parse(localStorage.getItem(BOOKMARK_KEY) || '{}'); }
  catch(e){ return {}; }
}
function toggleBookmark(id){
  const b = getBookmarks();
  if(b[id]) delete b[id]; else b[id] = true;
  localStorage.setItem(BOOKMARK_KEY, JSON.stringify(b));
}

async function loadData(){
  const results = await Promise.all(
    DATA_SOURCES.map(src =>
      fetch(src.file).then(r => r.ok ? r.json() : []).catch(() => [])
    )
  );
  allItems = results.flat();
  const latestDate = allItems.reduce((m, i) => i.date && i.date > m ? i.date : m, '');
  document.getElementById('metaLine').textContent =
    `총 ${allItems.length}건 · 최신 ${latestDate || '-'}`;
  render();
}

function uniqueValues(key){
  return Array.from(new Set(allItems.map(i => i[key]).filter(Boolean)));
}

function renderSidebar(){
  const sidebar = document.getElementById('sidebar');
  const counts = {};
  allItems.forEach(i => { counts[i.region] = (counts[i.region]||0) + 1; });

  let html = '<div class="sidebar-title">지역</div>';
  html += regionBtn('🌐', '전체', allItems.length, true);
  ALL_REGIONS.forEach(r => {
    html += regionBtn('📍', r, counts[r] || 0, counts[r] > 0);
  });
  html += '<hr>';
  html += `<button class="region-btn star-nav ${showBookmarksOnly?'active':''}" id="starToggle"><span class="icon">★</span><span class="name">즐겨찾기</span></button>`;
  sidebar.innerHTML = html;

  sidebar.querySelectorAll('.region-btn[data-region]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeRegion = btn.dataset.region;
      showBookmarksOnly = false;
      render();
    });
  });
  document.getElementById('starToggle').addEventListener('click', () => {
    showBookmarksOnly = !showBookmarksOnly;
    render();
  });
}

function regionBtn(icon, name, count, hasData){
  const active = (name === activeRegion && !showBookmarksOnly) ? 'active' : '';
  const emptyClass = hasData ? '' : 'empty';
  const countLabel = hasData ? count : '준비중';
  return `<button class="region-btn ${active} ${emptyClass}" data-region="${name}">
    <span class="icon">${icon}</span><span class="name">${name}</span><span class="cnt">${countLabel}</span>
  </button>`;
}

function renderCategoryFilters(){
  const catWrap = document.getElementById('categoryFilters');
  const cats = ['전체', ...uniqueValues('category')];
  catWrap.innerHTML = cats.map(c => {
    const icon = c === '전체' ? '' : (CATEGORY_ICONS[c] || '📄') + ' ';
    return `<button class="filter-chip ${c===activeCategory?'active':''}" data-value="${c}">${icon}${c}</button>`;
  }).join('');
  catWrap.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.value;
      render();
    });
  });
}

function render(){
  renderSidebar();
  renderCategoryFilters();
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const bookmarks = getBookmarks();

  let filtered = allItems.filter(item => {
    if(!showBookmarksOnly && activeRegion!=='전체' && item.region!==activeRegion) return false;
    if(activeCategory!=='전체' && item.category!==activeCategory) return false;
    if(showBookmarksOnly && !bookmarks[item.id]) return false;
    if(q){
      const haystack = `${item.title} ${item.dept} ${item.category}`.toLowerCase();
      if(!haystack.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a,b) => (b.date||'').localeCompare(a.date||''));

  document.getElementById('countText').textContent = `총 ${filtered.length}건`;

  const listEl = document.getElementById('list');
  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty">
      <strong>${showBookmarksOnly ? '즐겨찾기한 보도자료가 없어요' : '아직 표시할 보도자료가 없어요'}</strong>
      ${showBookmarksOnly ? '★ 버튼을 눌러 관심있는 보도자료를 담아보세요.' : '이 지역은 아직 준비중이거나, GitHub Actions가 다음 자정에 수집할 예정이에요.'}
    </div>`;
    return;
  }

  listEl.innerHTML = filtered.map(item => {
    const isBookmarked = !!bookmarks[item.id];
    return `
    <div class="item">
      <button class="star-btn ${isBookmarked?'active':''}" data-id="${item.id}">${isBookmarked?'★':'☆'}</button>
      <div class="tags">
        <span class="tag region">${item.region}</span>
        <span class="tag category">${CATEGORY_ICONS[item.category]||''} ${item.category||'미분류'}</span>
      </div>
      <a class="line" href="${item.url}" target="_blank" rel="noopener">
        ${escapeHtml(item.title)} <span class="dept">— ${escapeHtml(item.dept||'')}</span>
      </a>
      <span class="date">${item.date||''}</span>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      toggleBookmark(btn.dataset.id);
      render();
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

document.getElementById('searchInput').addEventListener('input', render);

loadData();
</script>

</body>
</html>
