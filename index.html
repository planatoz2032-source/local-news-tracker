<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2A44">
<title>지역 보도자료 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F2EA;
    --paper-dim:#EDE9DD;
    --ink:#1B2A44;
    --ink-soft:#4B5670;
    --seal:#A6303C;
    --line:#D9D3C2;
    --mono:'Noto Sans KR', sans-serif;
    --serif:'Noto Serif KR', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--mono);
    line-height:1.4;
  }

  header{
    border-bottom:2px solid var(--ink);
    padding:10px 16px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:10;
  }
  header h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:17px;
    margin:0;
    letter-spacing:-0.3px;
  }
  .quote{
    font-family:var(--serif);
    font-style:italic;
    font-size:11.5px;
    color:var(--ink-soft);
    flex:1;
    min-width:200px;
    text-align:center;
  }
  .meta-line{
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1100px;
    margin:0 auto;
  }

  /* ---- 왼쪽 지역 사이드바 ---- */
  .sidebar{
    width:150px;
    flex-shrink:0;
    padding:16px 10px;
    position:sticky;
    top:53px;
    height:calc(100vh - 53px);
    overflow-y:auto;
  }
  .sidebar-title{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:700;
    padding:0 8px 6px;
    letter-spacing:.5px;
  }
  .region-btn{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:7px 8px;
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-soft);
    border-radius:4px;
    cursor:pointer;
  }
  .region-btn:hover{ background:var(--paper-dim); }
  .region-btn.active{
    background:var(--ink);
    color:var(--paper);
    font-weight:700;
  }
  .region-btn .cnt{
    float:right;
    font-size:11px;
    opacity:.7;
  }
  .sidebar hr{
    border:none;
    border-top:1px solid var(--line);
    margin:12px 8px;
  }

  /* ---- 오른쪽 콘텐츠 ---- */
  .content{
    flex:1;
    min-width:0;
    padding:16px 16px 60px;
  }
  .search-box{
    width:100%;
    padding:9px 12px;
    font-size:14px;
    font-family:var(--mono);
    border:1.5px solid var(--ink);
    background:#fff;
    border-radius:2px;
    outline:none;
  }
  .search-box:focus{border-color:var(--seal);}

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:10px 0 0;
  }
  .filter-chip{
    font-family:var(--mono);
    font-size:12px;
    padding:4px 10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    border-radius:16px;
    cursor:pointer;
  }
  .filter-chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .filter-chip.star.active{
    background:var(--seal);
    border-color:var(--seal);
  }

  .count-line{
    margin:10px 0 0;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
  }

  .item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 2px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .item:hover{ background:var(--paper-dim); }

  .item .tags{ display:flex; gap:5px; flex-shrink:0; }
  .tag{
    font-size:10.5px;
    font-weight:700;
    padding:2px 6px;
    border-radius:2px;
    white-space:nowrap;
  }
  .tag.region{ background:var(--seal); color:#fff; }
  .tag.category{ background:var(--paper-dim); color:var(--ink-soft); border:1px solid var(--line); }

  .item a.line{
    flex:1;
    min-width:0;
    text-decoration:none;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item a.line:hover{ text-decoration:underline; }
  .item .dept{ color:var(--ink-soft); font-weight:400; }

  .item .date{
    flex-shrink:0;
    font-size:11.5px;
    color:var(--ink-soft);
    width:78px;
    text-align:right;
  }
  .star-btn{
    flex-shrink:0;
    border:none;
    background:none;
    cursor:pointer;
    font-size:16px;
    color:var(--line);
    line-height:1;
    padding:2px;
  }
  .star-btn.active{ color:var(--seal); }

  .empty{
    text-align:center;
    padding:70px 20px;
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.8;
  }
  .empty strong{ display:block; font-family:var(--serif); font-size:17px; color:var(--ink); margin-bottom:6px; }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding:16px;
    border-top:1px solid var(--line);
  }

  /* ---- 모바일: 사이드바를 상단 가로 스크롤로 ---- */
  @media (max-width:760px){
    .layout{ flex-direction:column; }
    .sidebar{
      width:100%;
      height:auto;
      position:static;
      display:flex;
      overflow-x:auto;
      padding:10px 12px;
      gap:4px;
    }
    .sidebar-title{ display:none; }
    .region-btn{ width:auto; white-space:nowrap; flex-shrink:0; }
    .region-btn .cnt{ float:none; margin-left:4px; }
    .sidebar hr{ display:none; }
    .item .date{ width:60px; font-size:10.5px; }
    .item{ font-size:12.5px; }
    .quote{ order:3; width:100%; text-align:left; }
  }
</style>
</head>
<body>

<header>
  <h1>보도자료</h1>
  <div class="quote">"Never regret yesterday. Life is in me today, and make my own tomorrow." — L. Ron Hubbard</div>
  <div class="meta-line" id="metaLine">불러오는 중...</div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-title">지역</div>
  </nav>

  <div class="content">
    <input type="text" class="search-box" id="searchInput" placeholder="제목, 부서, 키워드로 검색...">
    <div class="filters" id="categoryFilters"></div>

    <div class="count-line">
      <span id="countText">불러오는 중...</span>
      <span>최신순 정렬</span>
    </div>

    <main id="list"></main>
  </div>
</div>

<footer>
  각 게시물의 원문은 해당 지자체 공식 누리집에서 제공됩니다. ★를 눌러 즐겨찾기에 담아두세요 (이 브라우저에만 저장돼요).
</footer>

<script>
// 앞으로 지역이 준비되는 대로 이 목록의 file 경로를 추가하면 사이드바에 자동으로 반영됩니다.
const DATA_SOURCES = [
  { file: 'data/seoul.json', region: '서울특별시' },
  // { file: 'data/gyeonggi.json', region: '경기도' },
  // { file: 'data/daejeon.json', region: '대전광역시' },
  // { file: 'data/daegu.json', region: '대구광역시' },
  // { file: 'data/incheon.json', region: '인천광역시' },
  // { file: 'data/busan.json', region: '부산광역시' },
  // { file: 'data/jeonnam-gwangju.json', region: '전남광주통합특별시' },
  // { file: 'data/ansan.json', region: '안산시' },
  // { file: 'data/suwon.json', region: '수원시' },
  // { file: 'data/hwaseong.json', region: '화성시' },
];

// 사이드바에는 데이터가 아직 없는 지역도 미리 보여준다 (준비중으로 표시)
const ALL_REGIONS = [
  '서울특별시', '경기도', '대전광역시', '대구광역시', '인천광역시',
  '부산광역시', '전남광주통합특별시', '안산시', '수원시', '화성시'
];

const BOOKMARK_KEY = 'news-bookmarks-v1';
let allItems = [];
let activeRegion = '전체';
let activeCategory = '전체';
let showBookmarksOnly = false;

function getBookmarks(){
  try{ return JSON.parse(localStorage.getItem(BOOKMARK_KEY) || '{}'); }
  catch(e){ return {}; }
}
function toggleBookmark(id){
  const b = getBookmarks();
  if(b[id]) delete b[id]; else b[id] = true;
  localStorage.setItem(BOOKMARK_KEY, JSON.stringify(b));
}

async function loadData(){
  const results = await Promise.all(
    DATA_SOURCES.map(src =>
      fetch(src.file).then(r => r.ok ? r.json() : []).catch(() => [])
    )
  );
  allItems = results.flat();
  const latestDate = allItems.reduce((m, i) => i.date && i.date > m ? i.date : m, '');
  document.getElementById('metaLine').textContent =
    `총 ${allItems.length}건 · 최신 ${latestDate || '-'}`;
  render();
}

function uniqueValues(key){
  const set = new Set(allItems.map(i => i[key]).filter(Boolean));
  return Array.from(set);
}

function renderSidebar(){
  const sidebar = document.getElementById('sidebar');
  const counts = {};
  allItems.forEach(i => { counts[i.region] = (counts[i.region]||0) + 1; });

  let html = '<div class="sidebar-title">지역</div>';
  html += regionBtn('전체', allItems.length);
  ALL_REGIONS.forEach(r => {
    html += regionBtn(r, counts[r] || 0, counts[r] === undefined);
  });
  html += '<hr>';
  html += `<button class="region-btn star ${showBookmarksOnly?'active':''}" id="starToggle">★ 즐겨찾기</button>`;
  sidebar.innerHTML = html;

  sidebar.querySelectorAll('.region-btn[data-region]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeRegion = btn.dataset.region;
      render();
    });
  });
  document.getElementById('starToggle').addEventListener('click', () => {
    showBookmarksOnly = !showBookmarksOnly;
    render();
  });
}

function regionBtn(name, count){
  const active = name === activeRegion ? 'active' : '';
  const countLabel = count > 0 ? `<span class="cnt">${count}</span>` : `<span class="cnt">준비중</span>`;
  return `<button class="region-btn ${active}" data-region="${name}">${name}${countLabel}</button>`;
}

function renderCategoryFilters(){
  const catWrap = document.getElementById('categoryFilters');
  const cats = ['전체', ...uniqueValues('category')];
  catWrap.innerHTML = cats.map(c =>
    `<button class="filter-chip ${c===activeCategory?'active':''}" data-value="${c}">${c}</button>`
  ).join('');
  catWrap.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.value;
      render();
    });
  });
}

function render(){
  renderSidebar();
  renderCategoryFilters();
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const bookmarks = getBookmarks();

  let filtered = allItems.filter(item => {
    if(activeRegion!=='전체' && item.region!==activeRegion) return false;
    if(activeCategory!=='전체' && item.category!==activeCategory) return false;
    if(showBookmarksOnly && !bookmarks[item.id]) return false;
    if(q){
      const haystack = `${item.title} ${item.dept} ${item.category}`.toLowerCase();
      if(!haystack.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a,b) => (b.date||'').localeCompare(a.date||''));

  document.getElementById('countText').textContent = `총 ${filtered.length}건`;

  const listEl = document.getElementById('list');
  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty">
      <strong>${showBookmarksOnly ? '즐겨찾기한 보도자료가 없어요' : '아직 표시할 보도자료가 없어요'}</strong>
      ${showBookmarksOnly ? '★ 버튼을 눌러 관심있는 보도자료를 담아보세요.' : '이 지역은 아직 준비중이거나, GitHub Actions가 다음 자정에 수집할 예정이에요.'}
    </div>`;
    return;
  }

  listEl.innerHTML = filtered.map(item => {
    const isBookmarked = !!bookmarks[item.id];
    return `
    <div class="item">
      <div class="tags">
        <span class="tag region">${item.region}</span>
        <span class="tag category">${item.category||'미분류'}</span>
      </div>
      <a class="line" href="${item.url}" target="_blank" rel="noopener">
        ${escapeHtml(item.title)} <span class="dept">— ${escapeHtml(item.dept||'')}</span>
      </a>
      <span class="date">${item.date||''}</span>
      <button class="star-btn ${isBookmarked?'active':''}" data-id="${item.id}">${isBookmarked?'★':'☆'}</button>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      toggleBookmark(btn.dataset.id);
      render();
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

document.getElementById('searchInput').addEventListener('input', render);

loadData();
</script>

</body>
</html>
