<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지역 보도자료 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F2EA;
    --paper-dim:#EDE9DD;
    --ink:#1B2A44;
    --ink-soft:#4B5670;
    --seal:#A6303C;
    --seal-soft:#C9727C;
    --line:#D9D3C2;
    --mono:'Noto Sans KR', sans-serif;
    --serif:'Noto Serif KR', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--mono);
    line-height:1.5;
  }
  header{
    border-bottom:3px double var(--ink);
    padding:32px 20px 20px;
    text-align:center;
    position:relative;
  }
  .seal{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:54px;height:54px;
    border:2.5px solid var(--seal);
    border-radius:50%;
    color:var(--seal);
    font-family:var(--serif);
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    margin-bottom:10px;
    transform:rotate(-6deg);
  }
  h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(22px,5vw,34px);
    margin:0 0 6px;
    letter-spacing:-0.5px;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .updated{
    color:var(--ink-soft);
    font-size:12px;
    margin-top:10px;
  }

  .controls{
    max-width:880px;
    margin:24px auto 0;
    padding:0 20px;
  }
  .search-box{
    width:100%;
    padding:13px 16px;
    font-size:15px;
    font-family:var(--mono);
    border:1.5px solid var(--ink);
    background:#fff;
    border-radius:2px;
    outline:none;
  }
  .search-box:focus{border-color:var(--seal);}

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:14px 0 4px;
  }
  .filter-chip{
    font-family:var(--mono);
    font-size:12.5px;
    padding:6px 12px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    border-radius:20px;
    cursor:pointer;
    transition:all .15s;
  }
  .filter-chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  .count-line{
    max-width:880px;
    margin:16px auto 0;
    padding:0 20px;
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }

  main{
    max-width:880px;
    margin:0 auto;
    padding:0 20px 60px;
  }

  .item{
    display:block;
    text-decoration:none;
    color:inherit;
    padding:20px 4px;
    border-bottom:1px solid var(--line);
    transition:background .15s;
  }
  .item:hover{background:var(--paper-dim);}

  .item-meta{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    font-size:12px;
    color:var(--seal);
    font-weight:700;
    margin-bottom:6px;
  }
  .item-meta .region{
    background:var(--seal);
    color:#fff;
    padding:2px 8px;
    border-radius:2px;
    font-size:11px;
  }
  .item-meta .cat{ color:var(--ink-soft); font-weight:500; }
  .item-meta .date{ color:var(--ink-soft); font-weight:500; margin-left:auto; }

  .item-title{
    font-family:var(--serif);
    font-size:17px;
    font-weight:500;
    line-height:1.45;
    margin-bottom:4px;
  }
  .item-dept{
    font-size:12.5px;
    color:var(--ink-soft);
  }

  .empty{
    text-align:center;
    padding:80px 20px;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.8;
  }
  .empty strong{ display:block; font-family:var(--serif); font-size:18px; color:var(--ink); margin-bottom:8px; }

  footer{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    padding:20px;
    border-top:1px solid var(--line);
  }

  @media (max-width:480px){
    .item-meta .date{ margin-left:0; }
  }
</style>
</head>
<body>

<header>
  <div class="seal">보도</div>
  <h1>지역 보도자료 모음</h1>
  <div class="subtitle">주택 · 교통 · 도시계획 관련 소식을 한곳에서</div>
  <div class="updated" id="updatedLine"></div>
</header>

<div class="controls">
  <input type="text" class="search-box" id="searchInput" placeholder="제목, 부서, 키워드로 검색...">
  <div class="filters" id="regionFilters"></div>
  <div class="filters" id="categoryFilters"></div>
</div>

<div class="count-line">
  <span id="countText">불러오는 중...</span>
  <span>최신순 정렬</span>
</div>

<main id="list"></main>

<footer>
  각 게시물의 원문은 해당 지자체 공식 누리집에서 제공됩니다. 이 페이지는 제목·날짜·부서 정보만 모아 보여줍니다.
</footer>

<script>
const DATA_SOURCES = [
  { file: 'data/seoul.json', region: '서울특별시' },
  // 앞으로 다른 지역이 추가되면 여기에 한 줄씩 추가하면 됩니다.
  // { file: 'data/gyeonggi.json', region: '경기도' },
];

let allItems = [];
let activeRegion = '전체';
let activeCategory = '전체';

async function loadData(){
  const results = await Promise.all(
    DATA_SOURCES.map(src =>
      fetch(src.file).then(r => r.ok ? r.json() : []).catch(() => [])
    )
  );
  allItems = results.flat();
  render();
}

function uniqueValues(key){
  const set = new Set(allItems.map(i => i[key]).filter(Boolean));
  return ['전체', ...Array.from(set)];
}

function renderFilters(){
  const regionWrap = document.getElementById('regionFilters');
  const catWrap = document.getElementById('categoryFilters');

  regionWrap.innerHTML = uniqueValues('region').map(r =>
    `<button class="filter-chip ${r===activeRegion?'active':''}" data-type="region" data-value="${r}">${r}</button>`
  ).join('');

  catWrap.innerHTML = uniqueValues('category').map(c =>
    `<button class="filter-chip ${c===activeCategory?'active':''}" data-type="category" data-value="${c}">${c}</button>`
  ).join('');

  document.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const {type, value} = btn.dataset;
      if(type==='region') activeRegion = value;
      if(type==='category') activeCategory = value;
      render();
    });
  });
}

function render(){
  renderFilters();
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  let filtered = allItems.filter(item => {
    if(activeRegion!=='전체' && item.region!==activeRegion) return false;
    if(activeCategory!=='전체' && item.category!==activeCategory) return false;
    if(q){
      const haystack = `${item.title} ${item.dept} ${item.category}`.toLowerCase();
      if(!haystack.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a,b) => (b.date||'').localeCompare(a.date||''));

  document.getElementById('countText').textContent = `총 ${filtered.length}건`;

  const listEl = document.getElementById('list');
  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty">
      <strong>아직 표시할 보도자료가 없어요</strong>
      GitHub Actions가 하루 2번(0시, 12시) 자동으로 데이터를 수집합니다.<br>
      처음 설정하신 경우, Actions 탭에서 수동으로 한 번 실행해보세요.
    </div>`;
    return;
  }

  listEl.innerHTML = filtered.map(item => `
    <a class="item" href="${item.url}" target="_blank" rel="noopener">
      <div class="item-meta">
        <span class="region">${item.region}</span>
        <span class="cat">${item.category||'분류없음'}</span>
        <span class="date">${item.date||''}</span>
      </div>
      <div class="item-title">${escapeHtml(item.title)}</div>
      <div class="item-dept">${escapeHtml(item.dept||'')}</div>
    </a>
  `).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('updatedLine').textContent =
  '페이지 접속 시각: ' + new Date().toLocaleString('ko-KR');

loadData();
</script>

</body>
</html>
