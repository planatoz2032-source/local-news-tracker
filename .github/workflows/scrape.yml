name: Seoul News Scraper

on:
  schedule:
    - cron: '0 15,3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper/scrape_seoul.py

      - name: Commit updated data
        run: |
          git config user.name news-bot
          git config user.email news-bot@users.noreply.github.com
          git add data/seoul.json
          git diff --staged --quiet && echo no changes || git commit -m "update seoul data"
          git push
