name: 서울시 보도자료 수집

on:
  schedule:
    # UTC 기준 15:00, 03:00 = 한국시간(KST) 0시, 12시
    - cron: "0 15,3 * * *"
  workflow_dispatch: {}  # "Run workflow" 버튼으로 수동 실행도 가능하게

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: 서울시 보도자료 수집 실행
        run: python scraper/scrape_seoul.py

      - name: 변경된 데이터 저장(커밋)
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/seoul.json
          git diff --staged --quiet && echo "새 데이터 없음, 커밋 생략" || git commit -m "chore: 서울시 보도자료 업데이트 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
