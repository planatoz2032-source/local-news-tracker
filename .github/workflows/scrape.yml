name: 서울시 보도자료 수집

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install -r scraper/requirements.txt

      - name: 보도자료 수집 실행
        run: python scraper/scrape_seoul.py

      - name: 변경사항 커밋
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && echo "변경 없음" || git commit -m "보도자료 자동 업데이트 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
